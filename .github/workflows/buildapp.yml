# Build and Release uYouEnhanced
# Original idea by @ISnackable. Thanks to him for handling the hardest parts!
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml

name: Build and Release uYouEnhanced

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "18.6"
        required: true
        type: string
      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string
      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube IPA"
        default: ""
        required: true
        type: string
      bundle_id:
        description: "Modify the bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Modify the app name"
        default: "YouTube"
        required: true
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload IPA as artifact"
        default: true
        required: true
        type: boolean
      create_release:
        description: "Create a draft release"
        default: true
        required: true
        type: boolean
      ytuhd:
        description: "Include YTUHD"
        default: true
        required: true
        type: boolean
      sponsorblock:
        description: "Include iSponsorBlock"
        default: true
        required: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-latest
    permissions:
      contents: write

    # Export commonly used values as job env so steps can reference them consistently.
    env:
      THEOS: ${{ github.workspace }}/theos
      SDK_VERSION: ${{ github.event.inputs.sdk_version }}
      UYOU_VERSION: ${{ github.event.inputs.uyou_version }}
      BUNDLE_ID: ${{ github.event.inputs.bundle_id }}
      APP_NAME: ${{ github.event.inputs.app_name }}
      INPUT_YTUHD: ${{ github.event.inputs.ytuhd }}
      INPUT_SPONSORBLOCK: ${{ github.event.inputs.sponsorblock }}
      # safe default for RENAMED_IPA; rebrand step will overwrite
      RENAMED_IPA: ""

    steps:
      - name: Checkout Main
        uses: actions/checkout@v7
        with:
          path: main
          # Use provided commit_id when set, otherwise use the current ref
          ref: ${{ github.event.inputs.commit_id != '' && github.event.inputs.commit_id || github.ref }}
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew update
          # Install listed packages; build tools (make) may be provided by macOS but ensure GNU make is available via brew
          brew install ldid dpkg make wget unzip jq pipx || true
          # Add brew-installed gnu-make gnubin to PATH if present
          if [ -d "$(brew --prefix make)/libexec/gnubin" ]; then
            echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          fi
          # pipx places binaries into ~/.local/bin — add that to PATH for subsequent steps
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set PATH (ensure pipx-installed binaries and homebrew make are available)
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v6
        with:
          path: theos/sdks/
          # use github.event.inputs.sdk_version since this workflow is triggered via workflow_dispatch
          key: iOS-${{ github.event.inputs.sdk_version }}-SDK

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        env:
          THEOS: ${{ github.workspace }}/theos
          SDK_VERSION: ${{ github.event.inputs.sdk_version }}
        run: |
          # shallow clone only the sdks tree and extract requested sdk
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/aricloverALT/sdks/ sdks
          cd sdks
          git sparse-checkout set --no-cone "iPhoneOS${SDK_VERSION}.sdk"
          git checkout --quiet
          mkdir -p "$THEOS/sdks"
          mv *.sdk "$THEOS/sdks" || true

      - name: Setup Theos Jailed
        uses: actions/checkout@v7
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed

      - name: Install Theos Jailed
        run: ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Fix Theos broken pipe issue
        run: |
          # Ensure scripts don't fail because of '|' piped to head on macOS
          set -euo pipefail
          find "$THEOS" -name "*.sh" -type f | while read -r SCRIPT; do
            if grep -q '| head' "$SCRIPT" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$SCRIPT" 2>/dev/null || true
              echo "Patched: $SCRIPT"
            fi
          done
          find "$THEOS" -name "*.mk" -type f | while read -r MK; do
            if grep -q '| head' "$MK" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$MK" 2>/dev/null || true
              echo "Patched: $MK"
            fi
          done
          echo "Broken pipe fixes applied"

      - name: Install cyan and tbd
        run: |
          set -euo pipefail
          # Install the python package via pipx (adds script to ~/.local/bin)
          pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip || true
          # Make sure pipx-installed scripts are on PATH in subsequent steps
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # Install tbd binary for linking/stripping
          wget --quiet "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" -O /usr/local/bin/tbd || true
          chmod +x /usr/local/bin/tbd || true

      - name: Hash YT ipa url
        run: |
          URL_YT="$(jq -r '.inputs.decrypted_youtube_url' $GITHUB_EVENT_PATH)"
          echo "::add-mask::$URL_YT"
          echo "URL_YT=$URL_YT" >> $GITHUB_ENV

      - name: Prepare YouTube iPA
        id: prepare_youtube
        env:
          YOUTUBE_URL: ${{ github.event.inputs.decrypted_youtube_url }}
        run: |
          set -euo pipefail
          # download the provided YouTube IPA and extract version
          wget "$YOUTUBE_URL" --quiet -O main/YouTube.ipa
          cd main
          mv -f YouTube.ipa YouTube.zip
          unzip -q YouTube.zip
          # prefer CFBundleVersion, fallback to CFBundleShortVersionString
          plist="Payload/YouTube.app/Info.plist"
          youtube_version=""
          if [ -f "$plist" ]; then
            youtube_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist" 2>/dev/null || true)
            if [ -z "$youtube_version" ]; then
              youtube_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist" 2>/dev/null || true)
            fi
          fi
          if [ -z "$youtube_version" ]; then
            echo "Could not determine YouTube version from $plist" >&2
            youtube_version="unknown"
          fi
          echo "YT_VERSION=$youtube_version" >> $GITHUB_ENV
          echo "youtube_version=$youtube_version" >> $GITHUB_OUTPUT

      - name: Fix compiling & Build Package
        id: build_package
        env:
          THEOS: ${{ github.workspace }}/theos
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          APP_NAME: ${{ env.APP_NAME }}
          SDK_VERSION: ${{ env.SDK_VERSION }}
          UYOU_VERSION: ${{ env.UYOU_VERSION }}
          INPUT_YTUHD: ${{ env.INPUT_YTUHD }}
          INPUT_SPONSORBLOCK: ${{ env.INPUT_SPONSORBLOCK }}
        run: |
          set -euo pipefail
          cd main
          # Update or append Makefile variables using sed (BSD/macOS sed)
          if [ -f Makefile ]; then
            sed -i '' "s|^BUNDLE_ID .*|BUNDLE_ID = ${BUNDLE_ID}|" Makefile 2>/dev/null || echo "BUNDLE_ID = ${BUNDLE_ID}" >> Makefile
            sed -i '' "s|^DISPLAY_NAME .*|DISPLAY_NAME = ${APP_NAME}|" Makefile 2>/dev/null || echo "DISPLAY_NAME = ${APP_NAME}" >> Makefile
            sed -i '' "s|^export TARGET .*|export TARGET = iphone:clang:${SDK_VERSION}:16.0|" Makefile 2>/dev/null || echo "export TARGET = iphone:clang:${SDK_VERSION}:16.0" >> Makefile
          else
            echo "No Makefile found in main/ — skipping Makefile edits"
          fi

          # Convert boolean inputs to 1/0 for make variables
          if [ "${INPUT_YTUHD}" = "true" ] || [ "${INPUT_YTUHD}" = "True" ]; then
            YTUHD_ENABLED=1
          else
            YTUHD_ENABLED=0
          fi
          if [ "${INPUT_SPONSORBLOCK}" = "true" ] || [ "${INPUT_SPONSORBLOCK}" = "True" ]; then
            SPONSORBLOCK_ENABLED=1
          else
            SPONSORBLOCK_ENABLED=0
          fi

          # build package; capture the newest file in packages/ as output
          make package THEOS_PACKAGE_SCHEME=rootless IPA=Payload/YouTube.app FINALPACKAGE=1 YTUHD_ENABLED=${YTUHD_ENABLED} SPONSORBLOCK_ENABLED=${SPONSORBLOCK_ENABLED} || true
          # detect produced package
          package_file="$(ls -1t packages 2>/dev/null | head -n1 || true)"
          echo "package=${package_file}" >> $GITHUB_OUTPUT

      - name: Clone Open in YouTube (Safari Extension)
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/BillyCurtis/OpenYouTubeSafariExtension.git OpenYouTubeSafariExtension
          cd OpenYouTubeSafariExtension
          git sparse-checkout set --no-cone OpenYouTubeSafariExtension.appex
          git checkout --quiet
          mv -f *.appex .. || true

      - name: Normalize Extension Bundle ID for SideStore
        run: |
          set -euo pipefail
          PARENT_BUNDLE="${{ env.BUNDLE_ID }}"
          ORIG_PREFIX="com.google.ios.youtube"
          echo "Normalizing extension CFBundleIdentifier(s) to use parent prefix: ${PARENT_BUNDLE}"
          update_plist_id() {
            PLIST_PATH="$1"
            if [ ! -f "$PLIST_PATH" ]; then
              return
            fi
            /usr/bin/plutil -convert xml1 "$PLIST_PATH" >/dev/null 2>&1 || true
            CURRENT_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST_PATH" 2>/dev/null || true)
            if [ -z "$CURRENT_ID" ]; then
              return
            fi
            if [[ "$CURRENT_ID" == "$ORIG_PREFIX"* ]]; then
              SUFFIX="${CURRENT_ID#${ORIG_PREFIX}.}"
              if [ "$SUFFIX" = "$CURRENT_ID" ]; then
                SUFFIX="Extension"
              fi
              NEW_ID="${PARENT_BUNDLE}.${SUFFIX}"
              echo "Updating $PLIST_PATH: $CURRENT_ID -> $NEW_ID"
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $NEW_ID" "$PLIST_PATH" 2>/dev/null || \
                /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $NEW_ID" "$PLIST_PATH" 2>/dev/null || true
            else
              echo "Skipping $PLIST_PATH (does not start with $ORIG_PREFIX): $CURRENT_ID"
            fi
          }
          # Normalize any appex files present in workspace root
          for appex in ./*.appex; do
            if [ -d "$appex" ]; then
              PLIST="$appex/Info.plist"
              update_plist_id "$PLIST"
              find "$appex" -type f \( -name "*.plist" -o -name "*.entitlements" \) | while read -r f; do
                /usr/bin/plutil -convert xml1 "$f" >/dev/null 2>&1 || true
                if grep -q "$ORIG_PREFIX" "$f" >/dev/null 2>&1; then
                  echo "Replacing occurrences in $f"
                  perl -0777 -pe "s/\Q${ORIG_PREFIX}\E/${PARENT_BUNDLE}/g" -i "$f" || true
                fi
              done
            fi
          done

          APP_BUNDLE_DIR="main/Payload/YouTube.app"
          APP_EXTENSIONS_DIR="$APP_BUNDLE_DIR/Extensions"
          if [ -d "$APP_EXTENSIONS_DIR" ]; then
            echo "Removing ExtensionKit-style extensions (unresignable):"
            ls -1 "$APP_EXTENSIONS_DIR" || true
            rm -rf "$APP_EXTENSIONS_DIR" || true
          fi

          find "$APP_BUNDLE_DIR" -depth -type d -name "*AppMigration*" -print0 2>/dev/null \
            | xargs -0 -I{} sh -c 'echo "Removing {}"; rm -rf "{}"' || true

          if [ -d "$APP_BUNDLE_DIR" ]; then
            find "$APP_BUNDLE_DIR" -type d -name "*.appex" | while read -r appex; do
              if [ -d "$appex" ]; then
                PLIST="$appex/Info.plist"
                update_plist_id "$PLIST"
                find "$appex" -type f \( -name "*.plist" -o -name "*.entitlements" \) | while read -r f; do
                  /usr/bin/plutil -convert xml1 "$f" >/dev/null 2>&1 || true
                  if grep -q "$ORIG_PREFIX" "$f" >/dev/null 2>&1; then
                    echo "Replacing occurrences in $f"
                    perl -0777 -pe "s/\Q${ORIG_PREFIX}\E/${PARENT_BUNDLE}/g" -i "$f" || true
                  fi
                done
              fi
            done
          fi

          MAIN_APP_DIR="main/Payload/YouTube.app"
          if [ -d "$MAIN_APP_DIR" ]; then
            find "$MAIN_APP_DIR" -type f \( -name "*.plist" -o -name "*.entitlements" \) | while read -r f; do
              /usr/bin/plutil -convert xml1 "$f" >/dev/null 2>&1 || true
              if grep -q "$ORIG_PREFIX" "$f" >/dev/null 2>&1; then
                echo "Replacing occurrences in $f"
                perl -0777 -pe "s/\Q${ORIG_PREFIX}\E/${PARENT_BUNDLE}/g" -i "$f" || true
              fi
            done
          fi
          echo "Normalization complete."

      - name: Inject Tweaks Into IPA
        run: |
          set -euo pipefail
          cd main
          IPA_IN="packages/${{ steps.build_package.outputs.package }}"
          OUTNAME="uYouEnhanced_${{ env.YT_VERSION }}_v${{ env.UYOU_VERSION }}.ipa"
          # Collect tweaks — include any .deb packages and the Safari extension if present
          tweaks="OpenYouTubeSafariExtension.appex"
          for f in packages/*.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          # Ensure cyan is available (pipx installed into ~/.local/bin)
          export PATH="$HOME/.local/bin:$PATH"
          # Run cyan: -i input ipa file path is relative to current dir; adjust if needed
          cyan -i "$IPA_IN" -o "$OUTNAME" -uwef $tweaks -n "${{ env.APP_NAME }}" -b "${{ env.BUNDLE_ID }}" || true

      - name: Strip Unresignable Extensions From Final IPA
        id: strip_ipa
        run: |
          set -euo pipefail
          cd main
          OUTNAME="uYouEnhanced_${{ env.YT_VERSION }}_v${{ env.UYOU_VERSION }}.ipa"
          if [ ! -f "$OUTNAME" ]; then
            OUTNAME="$(basename "$(find . -maxdepth 3 -name 'uYouEnhanced_*.ipa' -print -quit)")"
          fi
          echo "Final IPA: $OUTNAME"
          echo "--- .appex bundles contained in final IPA ---"
          unzip -Z1 "$OUTNAME" | grep '\.appex/' | sed 's|^\(.*\.appex\)/.*|\1|' | sort -u | tee appex_list.txt || true
          BAD="$(grep -v '/PlugIns/' appex_list.txt || true)"
          if [ -n "$BAD" ]; then
            echo "Removing unresignable extensions:"
            printf '%s\n' "$BAD"
            printf '%s\n' "$BAD" | while IFS= read -r d; do
              zip -q -d "$OUTNAME" "${d}/*" || true
            done
          else
            echo "All extensions are under PlugIns/ - OK for SideStore."
          fi
          mkdir -p packages
          cp -f "$OUTNAME" "packages/$OUTNAME"
          find packages -maxdepth 1 -name "*.ipa" ! -name "$OUTNAME" -delete || true
          echo "Final SideStore-compatible IPA: packages/$OUTNAME"
          echo "final_ipa=$OUTNAME" >> "$GITHUB_OUTPUT"

      - name: Register Alternate App Icons
        run: |
          set -euo pipefail
          cd main
          IPA="packages/${{ steps.strip_ipa.outputs.final_ipa }}"
          rm -rf iconwork && mkdir -p iconwork && cd iconwork
          unzip -q "../$IPA" "Payload/YouTube.app/Info.plist"
          PLIST="Payload/YouTube.app/Info.plist"
          ICON_SRC="../main/Localizations/uYouPlus.bundle/AppIcons"
          PB=/usr/libexec/PlistBuddy
          # Create intermediate dicts FIRST (PlistBuddy cannot nest-create).
          for ROOT in CFBundleIcons "CFBundleIcons~ipad"; do
            $PB -c "Add :$ROOT dict" "$PLIST" 2>/dev/null || true
            $PB -c "Add :$ROOT:CFBundleAlternateIcons dict" "$PLIST" 2>/dev/null || true
          done
          for f in "$ICON_SRC"/*.png; do
            if [ ! -f "$f" ]; then
              continue
            fi
            NAME="$(basename "$f" .png)"
            cp -f "$f" "Payload/YouTube.app/$NAME.png"
            for ROOT in CFBundleIcons "CFBundleIcons~ipad"; do
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME dict" "$PLIST" 2>/dev/null || true
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME:CFBundleIconFiles array" "$PLIST" 2>/dev/null || true
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME:CFBundleIconFiles:0 string $NAME" "$PLIST" 2>/dev/null || true
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME:CFBundleIconName string $NAME" "$PLIST" 2>/dev/null || true
            done
            echo "Registered alternate icon: $NAME"
          done
          $PB -c "Print :CFBundleIcons:CFBundleAlternateIcons" "$PLIST" | head -20 || true
          zip -q "../$IPA" "$PLIST" Payload/YouTube.app/*.png || true
          cd .. && rm -rf iconwork
          echo "Alternate icons registered into $(basename "$IPA")"

      - name: Rebrand IPA Filename (3.0.4 -> 3.0.5)
        run: |
          set -euo pipefail
          cd main/packages
          OLD="${{ steps.strip_ipa.outputs.final_ipa }}"
          # Default NEW equals OLD; if we find 3.0.4 we will rename
          NEW="${OLD//3.0.4/3.0.5}"
          if [ "$OLD" != "$NEW" ] && [ -f "$OLD" ]; then
            mv "$OLD" "$NEW"
            echo "Renamed: $OLD -> $NEW"
          else
            echo "No 3.0.4 in filename or file missing: $OLD"
          fi
          echo "RENAMED_IPA=$NEW" >> "$GITHUB_ENV"

      - name: Upload Artifact
        if: ${{ github.event.inputs.upload_artifact }}
        uses: actions/upload-artifact@v7
        env:
          UYOU_VERSION: ${{ env.UYOU_VERSION }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
        with:
          name: uYouEnhanced_${{ steps.prepare_youtube.outputs.youtube_version }}_${{ env.UYOU_VERSION }}
          path: ${{ github.workspace }}/main/packages/${{ env.RENAMED_IPA }}
          if-no-files-found: error

      - name: Create Release
        if: ${{ github.event.inputs.create_release }}
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Use the youtube_version found in the prepare step and uYou version input
          tag_name: v${{ steps.prepare_youtube.outputs.youtube_version }}-${{ github.event.inputs.uyou_version }}-${{ github.run_number }}
          name: v${{ steps.prepare_youtube.outputs.youtube_version }}-${{ github.event.inputs.uyou_version }}-${{ github.run_number }}
          files: main/packages/*.ipa
          draft: true
